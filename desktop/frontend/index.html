<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalkingDuck</title>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif;--bg:light-dark(#fafafa,#202126);--fg:light-dark(#292a30,#e7e8ec);--muted:light-dark(#737780,#979da8);--stripe:light-dark(#00000005,#ffffff05);--hover:light-dark(#0000000c,#ffffff0d)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:16px;padding:16px 20px}h1{font-size:17px;margin:0}#status{font-size:12px;color:var(--muted);flex:1}
button{font:inherit;font-size:12px;padding:6px 11px;border:1px solid #8884;border-radius:6px;cursor:pointer;background:light-dark(#fff,#303238);color:inherit}button:disabled{opacity:.45;cursor:default}
main{overflow:auto;padding:0 12px 12px}table{border-collapse:collapse;width:100%;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}th{font:10px -apple-system,BlinkMacSystemFont,sans-serif;text-align:left;color:var(--muted);padding:5px 7px 9px;font-weight:500}td{white-space:pre;vertical-align:top;padding:5px 7px;border:0}tbody tr:nth-child(even){background:var(--stripe)}tbody tr:hover{background:var(--hover)}td:last-child{white-space:pre-wrap;overflow-wrap:anywhere;min-width:200px;width:100%}td:nth-child(1){font-weight:550}td:nth-child(3){color:light-dark(#526681,#b8c7dc)}
tbody tr.attention{background:light-dark(#fff1d6,#363126)}tbody tr.attention:nth-child(even){background:light-dark(#faebce,#3b3428)}tbody tr.attention:hover{background:light-dark(#f5e3bc,#463c2b)}
tbody tr.running{background:light-dark(#e0f5fa,#20363e)}tbody tr.running:nth-child(even){background:light-dark(#d8eff5,#243d46)}tbody tr.running:hover{background:light-dark(#cce9f1,#2b4852)}
tbody tr.pushed td,tbody tr.pushed td *{color:var(--muted)}
a.inventory-link{color:inherit;text-decoration:none}a.inventory-link:hover{text-decoration:underline}a.inventory-link:focus-visible{outline:1px solid var(--muted);outline-offset:3px}
.dim,.muted{color:var(--muted)}.cyan{color:light-dark(#087b99,#62cce9)}.orange{color:light-dark(#a64f25,#f4a172)}.purple{color:light-dark(#8052a6,#ba96df)}.green{color:light-dark(#44783c,#9cce85)}.yellow{color:light-dark(#927014,#e5c66b)}.blue{color:light-dark(#3979b3,#77b8ec)}.red{color:light-dark(#bc4141,#f18181)}
#empty{padding:45px 20px;color:var(--muted);font-size:13px}#warnings{white-space:pre-wrap;font-size:12px;color:light-dark(#956024,#d3b07c);margin:12px 20px}#error{color:light-dark(#b13b3b,#f18a8a);font-size:12px;margin:12px 20px}
</style>
<header><h1>TalkingDuck</h1><span id="status" role="status">Loading inventory…</span><button id="refresh">Refresh</button></header>
<main><table aria-label="Work inventory"><thead><tr id="headers"></tr></thead><tbody id="rows"></tbody></table><div id="empty">Collecting worktrees and agent sessions…</div></main>
<div id="error" role="alert"></div><div id="warnings"></div>

<script type="module">
import {Events} from '/wails/runtime.js';
import {copyable} from './copy.js';
Events.On('inventory:snapshot',event=>{
 const data=event.data,model=data.table||{columns:[],rows:[]},rows=model.rows;
 document.querySelector('#headers').replaceChildren(...model.columns.map(col=>{const th=document.createElement('th');th.textContent=col.label;th.style.textAlign=col.align||'left';return th}));
 document.querySelector('#refresh').disabled=data.loading;
 document.querySelector('#status').textContent=data.loading?`Refreshing ${data.refreshingPath||'inventory'}… · cached rows remain visible`:(data.updatedAt?`Pass finished ${new Date(data.updatedAt).toLocaleTimeString()} · ${rows.length} rows`:'Inventory unavailable');
 document.querySelector('#error').textContent=data.error||'';
 document.querySelector('#warnings').textContent=(data.warnings||[]).join('\n');
 document.querySelector('#empty').hidden=rows.length>0;
 document.querySelector('#empty').textContent=data.loading?'Collecting worktrees and agent sessions…':data.error?'Refresh failed. Try again.':'No worktrees to display.';
 document.querySelector('#rows').replaceChildren(...rows.map(row=>{
  const tr=document.createElement('tr');tr.className=row.state||'';tr.dataset.rowId=row.id;
  row.cells.forEach((cell,column)=>{
   const td=document.createElement('td');td.style.textAlign=model.columns[column].align||'left';
   cell.lines.forEach((line,n)=>{
    if(n)td.append(document.createElement('br'));
    line.items.filter(item=>!item.hidden).forEach(item=>{
     const el=document.createElement(item.link?'a':'span');el.textContent=item.text;el.className=item.color||'';if(item.bold)el.style.fontWeight='550';el.title=item.tooltip||'';
     if(item.link){el.classList.add('inventory-link');el.href='#';el.onclick=event=>{event.preventDefault();Events.Emit('inventory:open-'+item.link.kind,item.link.target)}}
     td.append(item.copy!==undefined?copyable(el,item.copy):el);
    });
   });tr.append(td);
  });return tr;
 }));
});
Events.On('inventory:open-error',e=>document.querySelector('#error').textContent=e.data);
Events.On('mock:error',e=>document.querySelector('#error').textContent=e.data);
document.querySelector('#refresh').onclick=()=>Events.Emit('inventory:refresh');
Events.Emit('inventory:ready');
</script></html>
