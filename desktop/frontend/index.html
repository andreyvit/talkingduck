<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalkingDuck</title>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif;--bg:light-dark(#fafafa,#202126);--fg:light-dark(#292a30,#e7e8ec);--muted:light-dark(#737780,#979da8);--stripe:light-dark(#00000005,#ffffff05)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:16px;padding:16px 20px}h1{font-size:17px;margin:0}#status{font-size:12px;color:var(--muted);flex:1}
button{font:inherit;font-size:12px;padding:6px 11px;border:1px solid #8884;border-radius:6px;cursor:pointer;background:light-dark(#fff,#303238);color:inherit}button:disabled{opacity:.45;cursor:default}
main{overflow:auto;padding:0 12px 12px}table{border-collapse:collapse;width:100%;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}th{font:10px -apple-system,BlinkMacSystemFont,sans-serif;text-align:left;color:var(--muted);padding:5px 7px 9px;font-weight:500}td{white-space:pre;vertical-align:top;padding:5px 7px;border:0}tbody tr:nth-child(even){background:var(--stripe)}td:last-child{white-space:pre-wrap;overflow-wrap:anywhere;min-width:200px;width:100%}td:nth-child(1){font-weight:550}td:nth-child(3){color:light-dark(#526681,#b8c7dc)}
.dim{color:var(--muted)}.cyan{color:light-dark(#087b99,#62cce9)}.orange{color:light-dark(#a64f25,#f4a172)}.purple{color:light-dark(#8052a6,#ba96df)}.green{color:light-dark(#44783c,#9cce85)}.yellow{color:light-dark(#927014,#e5c66b)}.blue{color:light-dark(#3979b3,#77b8ec)}.red{color:light-dark(#bc4141,#f18181)}
#empty{padding:45px 20px;color:var(--muted);font-size:13px}#warnings{white-space:pre-wrap;font-size:12px;color:light-dark(#956024,#d3b07c);margin:12px 20px}#error{color:light-dark(#b13b3b,#f18a8a);font-size:12px;margin:12px 20px}
</style>
<header><h1>TalkingDuck</h1><span id="status" role="status">Loading inventory…</span><button id="refresh">Refresh</button></header>
<main><table aria-label="Work inventory"><thead><tr id="headers"></tr></thead><tbody id="rows"></tbody></table><div id="empty">Collecting worktrees and agent sessions…</div></main>
<div id="error" role="alert"></div><div id="warnings"></div>

<script type="module">
import {Events} from '/wails/runtime.js';
const headers=['Folder','Agent','Ticket','Rev','Stage','Tasks','Run','Ask','Q / S','Edit','New','Info','↓','↑','Title'];
for(const label of headers){const th=document.createElement('th');th.textContent=label;document.querySelector('#headers').append(th)}
function color(value,column){
 const text=value.trim();
 if(!text||text==='?'||text==='--')return 'dim';
 if(column===1)return {Codex:'cyan',Claude:'orange',Grok:'purple'}[text.replace(/!$/,'')]||'dim';
 if(column===4)return {HL:'blue',LL:'purple',EX:'cyan',FIN:'green',SQ:'purple',PUSH:'yellow',REBA:'orange'}[text]||'dim';
 if(column===6||column===7)return {'▶':'cyan','✓':'green','!':'yellow'}[text]||'dim';
 if(column>=9&&column<=13){if(['0','?'].includes(text.replace(/^[±?ℹ︎⇣⇡]+/u,'').trim()))return 'dim';return ['yellow','green','blue','red','cyan'][column-9]}
 return '';
}
Events.On('inventory:snapshot',event=>{
 const data=event.data,rows=data.rows||[];
 document.querySelector('#refresh').disabled=data.loading;
 document.querySelector('#status').textContent=data.loading?`Refreshing ${data.refreshingPath||'inventory'}… · cached rows remain visible`:(data.updatedAt?`Pass finished ${new Date(data.updatedAt).toLocaleTimeString()} · ${rows.length} rows`:'Inventory unavailable');
 document.querySelector('#error').textContent=data.error||'';
 document.querySelector('#warnings').textContent=(data.warnings||[]).join('\n');
 document.querySelector('#empty').hidden=rows.length>0;
 document.querySelector('#empty').textContent=data.loading?'Collecting worktrees and agent sessions…':data.error?'Refresh failed. Try again.':'No worktrees to display.';
 document.querySelector('#rows').replaceChildren(...rows.map(row=>{
  const tr=document.createElement('tr');row.forEach((value,column)=>{const td=document.createElement('td');td.textContent=value;td.className=color(value,column);tr.append(td)});return tr;
 }));
});
Events.On('mock:error',e=>document.querySelector('#error').textContent=e.data);
document.querySelector('#refresh').onclick=()=>Events.Emit('inventory:refresh');
Events.Emit('inventory:ready');
</script></html>
