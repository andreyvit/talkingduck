<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'">
<title>Markdown Preview</title><link rel="stylesheet" href="/github-markdown-dark.css"><link rel="stylesheet" href="/markdown.css">
<div id="layout"><nav id="toc" aria-label="Table of contents"></nav><main id="scroller" tabindex="-1"><article class="markdown-body" id="document"></article></main></div>
<footer><div class="statusbar"><nav id="keys" aria-label="Preview actions"></nav></div><div id="error" role="alert"></div></footer>
<dialog id="history" aria-labelledby="history-title"><h2 id="history-title">Recent Markdown files</h2><input id="history-filter" type="search" placeholder="Filter by name or path" aria-label="Filter recent files"><div id="history-list"></div><p id="history-empty">No recent Markdown files. Open a spec from the dashboard with S.</p><button id="history-close">Esc Close</button></dialog>
<script type="module" src="/markdown.js"></script></html>
