<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalkingDuck Settings</title><link rel="stylesheet" href="/settings.css">
<main>
<section aria-labelledby="applications-title"><h2 id="applications-title">Applications</h2>
<div class="group"><form id="editor-form"></form><form id="git_client-form"></form></div>
<p class="section-help">Open the selected project with E (editor) or G (Git client). Apps must be installed.</p></section>
<section aria-labelledby="tickets-title"><h2 id="tickets-title">Tickets</h2><div class="group"><form id="tracker-form"></form></div></section>
<section aria-labelledby="folders-title"><div class="section-heading"><h2 id="folders-title">Folders</h2><button id="add">Add Folder…</button></div>
<div class="group folders"><table><colgroup><col class="use-col"><col><col class="shortcut-col"></colgroup><thead><tr><th class="use-cell">Use</th><th>Folder</th><th>Menu Bar Shortcut</th></tr></thead><tbody id="folders"></tbody></table></div>
<p id="error" role="status"></p></section>
<section aria-labelledby="archives-title"><h2 id="archives-title">Recently Archived</h2><div id="archives" class="group"></div></section>
<section aria-labelledby="connection-title"><h2 id="connection-title">Connection</h2><div class="group"><div class="form-row"><label for="address">MCP server</label><div id="address-control"></div></div></div>
<p id="mcp-error" class="section-help"></p></section>
<section aria-labelledby="configuration-title"><h2 id="configuration-title">Configuration File</h2><div class="group">
<div class="form-row"><span class="form-label">Format</span><span>JSON</span></div>
<div class="form-row"><span class="form-label">Location</span><div class="path-control"><span id="path"></span><button id="reveal">Reveal</button></div></div>
</div></section>
</main><script type="module" src="/settings.js"></script></html>
