<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalkingDuck Settings</title>
<style>
:root{color-scheme:light dark;font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:light-dark(#292a30,#e7e8ec);background:light-dark(#fafafa,#202126)}
body{margin:24px}h1{font-size:18px;margin:0 0 18px}h2{font-size:14px;margin:22px 0 10px}input,select,button{padding:6px 8px;border:1px solid #8885;border-radius:5px;background:light-dark(#fff,#303238);color:inherit;font:inherit}button{cursor:pointer}input{box-sizing:border-box;width:100%;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}p{color:light-dark(#737780,#979da8);font-size:12px;line-height:1.5}#error{color:light-dark(#b13b3b,#f18a8a)}table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:light-dark(#737780,#979da8);white-space:nowrap}td,th{padding:7px 8px;border-bottom:1px solid #8882;vertical-align:top}td:first-child{width:100%;overflow-wrap:anywhere}td small{display:block;color:light-dark(#737780,#979da8);margin-top:3px;font-size:11px}.folders{border:1px solid #8883;border-radius:6px}thead{position:sticky;top:0;background:light-dark(#fafafa,#202126)}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.toolbar h2{margin:0}#path{overflow-wrap:anywhere}
</style>
<h1>Settings</h1>
<div class="toolbar"><h2>Folders</h2><button id="add">Add Folder…</button></div>
<div class="folders"><table><thead><tr><th>Folder</th><th>Monitoring</th><th>Menu Bar Shortcut</th></tr></thead><tbody id="folders"></tbody></table></div>
<p>Only shown folders are monitored. Discovered folders start hidden. A menu bar shortcut labels the folder in the menu bar; Hide leaves it out.</p>
<p id="error" role="status"></p>
<h2><label for="address">MCP server address</label></h2>
<input id="address" readonly placeholder="Starting server…">
<p id="mcp-error"></p><p id="path"></p>
<script type="module" src="/settings.js"></script></html>
